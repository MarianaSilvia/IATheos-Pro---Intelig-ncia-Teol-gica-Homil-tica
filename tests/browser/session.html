<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Fixture local de sessão</title>
  </head>
  <body>
    <h1>Sessão de teste — somente emulador</h1>
    <p>
      Cria uma identidade Google fictícia no projeto demo-iatheos, sem acessar o
      Google real ou conceder permissões administrativas.
    </p>
    <button id="login">Autenticar fixture local</button>
    <p id="status" role="status"></p>
    <script type="module">
      import { auth } from "/src/lib/firebase.ts";
      import { GoogleAuthProvider, signInWithCredential } from "firebase/auth";
      document.getElementById("login").onclick = async () => {
        const status = document.getElementById("status");
        try {
          if (
            auth.app.options.projectId !== "demo-iatheos" ||
            !auth.emulatorConfig
          )
            throw new Error("Fixture restrita ao emulador.");
          const credential = GoogleAuthProvider.credential(
            JSON.stringify({
              sub: "browser-fixture",
              email: "browser-fixture@example.test",
              email_verified: true,
              name: "Estudante de Teste",
            }),
          );
          await signInWithCredential(auth, credential);
          status.textContent =
            "Sessão de teste autenticada. Abra o aplicativo.";
          const link = document.createElement("a");
          link.href = "/";
          link.textContent = "Abrir IATheos Pro";
          document.body.append(link);
        } catch (error) {
          status.textContent = error.message;
        }
      };
    </script>
  </body>
</html>
