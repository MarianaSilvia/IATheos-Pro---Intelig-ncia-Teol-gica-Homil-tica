name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start Supabase local emulators
        run: npm run supabase:start
      - name: Validate Supabase RLS and database rules
        run: npm run supabase:test
      - name: Stop Supabase local emulators
        if: always()
        run: npm run supabase:stop
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
